<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>My Study Hub</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
header{padding:32px 18px 20px;max-width:900px;margin:auto}.small{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
h1{font-size:38px;letter-spacing:-1.5px;margin:6px 0}p{color:var(--muted);margin:0}
main{max-width:900px;margin:auto;padding:0 18px 45px}
.search{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;outline:none;margin:5px 0 22px}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}
.subject{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;cursor:pointer}
.subject.active{border:2px solid var(--accent)}.subject .emoji{font-size:28px}
.subject h2{font-size:19px;margin:10px 0 4px}.subject p{font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
h3{font-size:25px;margin:4px 0}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}
.chapter{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:10px 0;overflow:hidden}
.chapter-head{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer}
.chapter-name{font-weight:750}.count{font-size:12px;color:var(--muted)}
.lectures{display:none;border-top:1px solid var(--line);padding:6px 10px 10px}.chapter.open .lectures{display:block}
.lecture{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line)}
.lecture:last-child{border-bottom:0}.num{color:var(--muted);font-size:12px;width:24px}
.title{flex:1;font-size:14px}.open{background:var(--accent);color:#fff;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700}
.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}
.note{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;font-size:13px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 20px 35px}
@media(max-width:650px){.subjects{grid-template-columns:1fr}.subject{padding:15px}.subject .emoji{display:inline-block;margin-right:7px}.subject h2{display:inline}}
</style>
</head>
<body>
<header><div class="small">PERSONAL STUDY LIBRARY</div><h1>My Study Hub</h1><p>All your lectures, arranged simply.</p></header>
<main>
<input id="search" class="search" type="search" placeholder="Search chapter or lecture…">
<section id="subjects" class="subjects"></section>
<div class="bar"><div><div class="small">SUBJECT</div><h3 id="heading">Physics</h3></div><button id="all">All subjects</button></div>
<section id="content"></section>
<div class="note"><strong>Your lectures go in the links.</strong><br><br>This website organises your lectures. Your large videos should stay in Google Drive, OneDrive, iCloud, etc. Replace the example links with your own share links.</div>
</main><footer>My Study Hub</footer>
<script>
const subjects=[
{id:"physics",name:"Physics",emoji:"⚡",desc:"Chapters & lectures"},
{id:"chemistry",name:"Chemistry",emoji:"🧪",desc:"Chapters & lectures"},
{id:"biology",name:"Biology",emoji:"🧬",desc:"Chapters & lectures"}];

const chapters=[
{subject:"physics",chapter:"Kinematics",lectures:[
{title:"Lecture 01 — Introduction",url:"https://drive.google.com/"},
{title:"Lecture 02 — Distance & Displacement",url:"https://drive.google.com/"},
{title:"Lecture 03 — Velocity",url:"https://drive.google.com/"}]},
{subject:"physics",chapter:"Laws of Motion",lectures:[
{title:"Lecture 01 — Introduction",url:"https://drive.google.com/"}]},
{subject:"chemistry",chapter:"Some Basic Concepts of Chemistry",lectures:[
{title:"Lecture 01 — Mole Concept",url:"https://drive.google.com/"},
{title:"Lecture 02 — Stoichiometry",url:"https://drive.google.com/"}]},
{subject:"biology",chapter:"The Cell",lectures:[
{title:"Lecture 01 — Cell Structure",url:"https://drive.google.com/"}]}];

let active="physics";
const subjectBox=document.getElementById("subjects"),content=document.getElementById("content"),heading=document.getElementById("heading"),search=document.getElementById("search");
function renderSubjects(){subjectBox.innerHTML=subjects.map(s=>`<div class="subject ${s.id===active?'active':''}" data-id="${s.id}"><span class="emoji">${s.emoji}</span><h2>${s.name}</h2><p>${s.desc}</p></div>`).join("");document.querySelectorAll(".subject").forEach(x=>x.onclick=()=>{active=x.dataset.id;renderSubjects();render()})}
function render(){heading.textContent=active==="all"?"All Subjects":subjects.find(s=>s.id===active)?.name;const q=search.value.toLowerCase().trim();const filtered=chapters.filter(c=>{if(active!=="all"&&c.subject!==active)return false;return(c.chapter+" "+c.lectures.map(l=>l.title).join(" ")).toLowerCase().includes(q)});if(!filtered.length){content.innerHTML='<div class="empty">No lectures found.</div>';return}content.innerHTML=filtered.map(c=>`<div class="chapter"><div class="chapter-head"><div><div class="chapter-name">${esc(c.chapter)}</div><div class="count">${c.lectures.length} lecture${c.lectures.length!==1?'s':''}</div></div><span>⌄</span></div><div class="lectures">${c.lectures.map((l,i)=>`<div class="lecture"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="title">${esc(l.title)}</div><a class="open" href="${l.url}" target="_blank" rel="noopener">Open</a></div>`).join("")}</div></div>`).join("");document.querySelectorAll(".chapter-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"))}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
search.oninput=render;document.getElementById("all").onclick=()=>{active="all";renderSubjects();render()};renderSubjects();render();
</script>
</body></html>
